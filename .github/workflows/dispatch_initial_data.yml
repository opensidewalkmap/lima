name: Dispatch initial Lima data generation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch_initial_data.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'trigger initial Lima data generation')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical daily workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run data_daily_updating.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f force_regeneration=true
